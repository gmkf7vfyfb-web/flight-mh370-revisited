[workspace]
resolver = "2"
members = ["crates/geo", "crates/satcom", "crates/flight", "crates/hypothesis", "crates/mh370", "crates/ocean", "crates/compose", "hypotheses"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
geo = { path = "crates/geo", package = "mh370-geo" }
satcom = { path = "crates/satcom", package = "mh370-satcom" }
flight = { path = "crates/flight", package = "mh370-flight" }
hypothesis = { path = "crates/hypothesis", package = "mh370-hypothesis" }
hypotheses = { path = "hypotheses", package = "mh370-hypotheses" }
ocean = { path = "crates/ocean", package = "mh370-ocean" }
libc = "0.2"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
codegen-units = 1
lto = "thin"
