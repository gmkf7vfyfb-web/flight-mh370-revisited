# Stage 2: stage 1 plus the fuel model.
#
# Initial fuel is the ACARS 43,800 kg at 17:06:43 carried forward to the filter's 18:01:49 prior
# epoch on Boeing's own burn for that segment: 43,800 - 33,524 = 10,276 kg over 78.73 min to
# arc 1, and 18:01:49 is 70.0% of the way, giving 36,609 kg. Zero-fuel weight 174,196 kg from the
# same report. The flow factor is the calibration against Appendix 1.6E, N(1.0085, 0.0178),
# drawn once per path so the posterior integrates over how well the tables fit this airframe.
#
# Two evidence terms, both declared:
#   require_power_until = m0011 - the aircraft transmitted at 00:11, so a path whose tank ran
#     dry before then contradicts the data.
#   exhaustion at 00:17:30 +/- 300 s - the 00:19:29 log-on followed engine failure and an APU
#     start, so exhaustion should sit shortly before it. This is the weaker of the two.
name = "stage2-fuel-hardonly"
seeds = [1, 2, 3, 4]
# Particle allocation equalised and doubled, 2.8M per mode against the base
# [1M, 0.5M, 2.5M, 0.5M, 2.5M]. This is a sampler change, not a model change: the mode prior
# stays equal and the pooling factors correct for the allocation, so the posterior is unchanged in
# expectation. The reason is measured, not guessed. The fuel evidence cuts the number of distinct
# surviving prior draws by about 3.3x (TT 1,020 -> 314, LNAV 1,114 -> 349, MH 295 -> 96,
# MT 200 -> 76), because the prior proposes many paths that burn out before 00:11 and the
# require_power_until term correctly rejects them. With only tens of draws left in MH and MT -
# the two modes that carry the shoulder - the pooled curve depends on the seed and split-half
# overlap fell to 0.743. Equalising stops starving those two modes and doubling restores the draw
# count; softening the evidence instead would have traded a real observation for a convergence
# number.
particles_per_mode = [2800000, 2800000, 2800000, 2800000, 2800000]


[[cases]]
id = "bto-bfo"
use_bfo = true

[inputs]
observations = "../../data/variants/satcom-observations-bfo4hz.csv"
fuel_tables = "../../data/fuel-tables.json"

[prior]
track_sd_deg = 2.0

[dynamics]
mach_range = [0.41, 0.86]
altitude_range_ft = [2000.0, 43000.0]
bfo_vertical_rate = true

# Troubleshooting, attempt 3. The exhaustion-timing Gaussian is dropped here and only the hard
# observation is kept. Measured reason: the burn model's own weighted median exhaustion is
# 23:17:20, and a target of 00:17:30 with a 300 s sd sits 12.0 standard deviations above it,
# keeping a 14.6% slice of weight. Reweighting 12 sd into the tail of the proposal cannot be
# fixed by adding particles - equalising the allocation raised the surviving draws in MH from 96
# to 531 and in MT from 76 to 380 and moved split-half only from 0.743 to 0.755. The hard
# requirement that the aircraft still had fuel at 00:11 is the observation; the timing of
# exhaustion relative to the 00:19 log-on is an inference about APU and SDU start-up and is the
# weaker claim, so it is the one to drop.
[fuel]
initial_kg = 36609.0
zfw_kg = 174196.0
factor_mean = 1.0085
factor_sd = 0.0178
require_power_until = "m0011"
