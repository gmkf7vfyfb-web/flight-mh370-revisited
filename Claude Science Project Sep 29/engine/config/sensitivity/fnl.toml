# Sensitivity: NCEP FNL operational analysis (1 deg, 6-hourly) instead of ERA5 (same model otherwise).
# The closest public analogue of the ACCESS-G operational analysis Davey et al. used.
# Build the grid with: .venv/bin/python .sources/weather-sensitivity/extract.py fnl /tmp/fnl-raw data/fnl-wind-temperature.bin
name = "fnl"
seeds = [1, 2, 3, 4]

[[cases]]
id = "bto-bfo"
use_bfo = true

[[cases]]
id = "bto-only"
use_bfo = false
seeds = [1, 2]

[inputs]
era5 = "../../data/fnl-wind-temperature.bin"
