# Stage 3: stage 2 plus a drifting BFO bias.
#
# The book models the bias as an unknown constant and inflates the measurement sd from 4.3 Hz to
# 7 Hz to cover the fact that it is not one (p. 29). This run instead lets the bias wander and
# sets the measurement sd to the genuinely random part, 0.995 Hz, estimated in this repository
# from 78 successive differences inside the 18:39 and 23:14 call clusters with each cluster's
# mean removed, so bias drift is excluded from it.
#
# The drift rate is calibrated to reproduce the book's own total uncertainty where the book's
# decorrelation argument holds. With a random part of 0.995 Hz and hourly handshakes,
#   rate = (7^2 - 0.995^2) / 3600 s = 0.01334 Hz^2/s
# gives a total of 7.00 Hz across an hourly gap - identical to the published model - while
# giving 1.05 Hz across the 9-second gap between the two 18:28 messages and 3.22 Hz from 18:28
# to the 18:39 call. So it matches the book where the book is defensible and is tighter where
# its "generally at least an hour apart" argument does not apply, which is exactly the early
# cluster that establishes the turn south.
name = "stage3-bias-drift-equal"
seeds = [1, 2, 3, 4]
# Particle allocation equalised and doubled, 2.8M per mode against the base
# [1M, 0.5M, 2.5M, 0.5M, 2.5M]. This is a sampler change, not a model change: the mode prior
# stays equal and the pooling factors correct for the allocation, so the posterior is unchanged in
# expectation. The reason is measured, not guessed. The fuel evidence cuts the number of distinct
# surviving prior draws by about 3.3x (TT 1,020 -> 314, LNAV 1,114 -> 349, MH 295 -> 96,
# MT 200 -> 76), because the prior proposes many paths that burn out before 00:11 and the
# require_power_until term correctly rejects them. With only tens of draws left in MH and MT -
# the two modes that carry the shoulder - the pooled curve depends on the seed and split-half
# overlap fell to 0.743. Equalising stops starving those two modes and doubling restores the draw
# count; softening the evidence instead would have traded a real observation for a convergence
# number.
particles_per_mode = [2800000, 2800000, 2800000, 2800000, 2800000]


[[cases]]
id = "bto-bfo"
use_bfo = true

[inputs]
observations = "../../data/variants/satcom-observations-bfo1hz.csv"
fuel_tables = "../../data/fuel-tables.json"

[prior]
track_sd_deg = 2.0

[bfo_bias]
drift_hz2_per_s = 0.01334

[dynamics]
mach_range = [0.41, 0.86]
altitude_range_ft = [2000.0, 43000.0]
bfo_vertical_rate = true

[fuel]
initial_kg = 36609.0
zfw_kg = 174196.0
factor_mean = 1.0085
factor_sd = 0.0178
require_power_until = "m0011"
exhaustion_target_utc = "2014-03-08T00:17:30Z"
exhaustion_sd_s = 300.0
