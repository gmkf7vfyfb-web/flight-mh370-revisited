# Audit F3 short test (Pete GO 15 Oct 2026): the pure reproduction davey2016-inmarsat.toml with a 1 s
# propagation step in cruise and in manoeuvres (code defaults 10 s and 5 s; Davey et al. 2016 use 1 s).
# Compare with config/sensitivity/bfo-sd-check/repro-bfo7.toml (same base, same seeds, default steps).
# Not byte-comparable (the step schedule differs), so compare statistically.
name = "repro-step1"
seeds = [1, 2, 3, 4]

[[cases]]
id = "bto-bfo"
use_bfo = true

[dynamics]
cruise_step_s = 1.0
manoeuvre_step_s = 1.0
