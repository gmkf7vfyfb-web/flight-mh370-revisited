# Run-J northern supplement seeds (core, 18 Oct 2026). Same stack as run J waypoints (config/sensitivity/run-j/
# size-sampler.toml) except: NEW seeds 1001-1016 (no overlap with any run J stream) and particles re-allocated
# across modes towards the modes that carry the north (option 1 of the mode-allocation work order; exact, the
