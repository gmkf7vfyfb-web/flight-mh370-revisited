# The job writes pass2.toml from this, with G_DIR replaced by the absolute path of the g files.
name = "r20-pass2"
[output]
handoff_rows = 100000
[output.handoff_lookahead]
horizons = { m0011 = "m0019b" }
oversample = 50
defensive = 0.2
g_index = "particle"
g_files = { m0011 = "G_DIR/g-{seed}-{mode}.npy" }
