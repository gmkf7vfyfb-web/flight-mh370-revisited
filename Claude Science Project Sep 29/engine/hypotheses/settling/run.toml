# Settling is a transform, not evidence: it adds no likelihood, so a run with it selected is
# the base estimate unchanged. Its outputs are wreckage draws, streamed to their consumer (core
# request 12, ruled 9 Oct; stream.rs is the stub of the hook) and the moment diagnostic via
# `mh370 evaluate`.
base = "../../config/integrated.toml"
name = "settling"

[hypotheses.settling]
moment_draws = 256
step_m = 50.0
terms = ["carry", "float", "current", "glide", "ocean-error", "diffusion"]
# Below the ocean model's own bottom: hold-deepest-level | linear-to-zero-at-seabed | refuse
# (the shared crate's three rules). Never a silent zero.
below_model_bottom = "hold-deepest-level"
# Float phase through the shared integrator. Step 10 min; each element stops at its own sink
# time (Particle.end_time). a_stokes 0: floating wreckage moves with the current plus leeway x wind only, a
# DECLARED first-pass choice pending drift's object-response result (Stokes dominated drift's
# sensitivity). Diffusivity absent: the shared provisional prior, one K per draw.
float_step_s = 600.0
float_a_stokes = 0.0

# Floating share: multiplier on every element's stays-afloat share (Pete 9 Oct: keep the table,
# vary x0.5 and x1.5 as a declared sensitivity; drift reports how its result responds).
floating_share_scale = 1.0

# Implosion at depth: a DECLARED ALTERNATIVE (Pete 9 Oct), off in the baseline (progressive
# flooding). Uncomment to run it. Share of cabin contents carried inside a fuselage section per
# family [intact, broken, fragmented], and the collapse depth. Assumptions, no calibration case.
# [hypotheses.settling.implosion]
# inside_share = [0.8, 0.4, 0.0]
# collapse_depth_m = { log_uniform = [10.0, 1000.0] }

# Occupants class: config-gated, DEFAULT OFF (ruling 9 Oct ~04:15). Evidential only once drift has
# a 2014 surface-search observation model. Uncomment to run it. Every value is a declared
# assumption except the people aboard (227 passengers, 12 crew) and the AF447 anchor for the
# broken family's surface share (50 of 228 recovered at the surface within days: a lower bound).
# Body properties are general knowledge, not checked against a forensic source; the material
# density is held above 1,060 kg/m3 by the table's rule, which excludes the least dense bodies.
# [hypotheses.settling.occupants]
# mass_share = 0.10
# stays_afloat = [0.05, 0.22, 0.35]
# sinks_at_once = [0.85, 0.60, 0.40]
# [hypotheses.settling.occupants.element]
# areal_density_kg_m2 = { uniform = [80.0, 130.0] }
# material_density_kg_m3 = { uniform = [1065.0, 1100.0] }
# drag_coefficient = { uniform = [0.9, 1.3] }
# descent_factor = 1.0
# glide_ratio = { uniform = [0.0, 0.3] }
# glide_memory_m = { log_uniform = [10.0, 200.0] }
# carry_s = { uniform = [0.0, 2.0] }
# carry_lateral = 0.5
# float_s = { log_uniform = [600.0, 21600.0] }
# leeway = { uniform = [0.005, 0.02] }
# pieces = 239.0

# Ocean-product error, realised ONCE per wreckage draw and shared by the float and sink phases.
# The shared crate's banded structure (ocean transport item 4) with the first pass's banded
# magnitudes: 0.10 m/s per component at the surface (to 100 m), 0.05 m/s in the upper ocean (to
# 1,000 m), 0.02 m/s below, and 0.03 m/s within 200 m of the seabed. Each band is an independent
# realisation (shared owner's choice). PROVISIONAL magnitudes; the error model's form is the shared
# owner's open question (brief section 8).
[hypotheses.settling.ocean_error]
kind = "uniform-offset"
sigma_m_s = 0.10

[hypotheses.settling.ocean_error.bands]
surface_to_m = 100.0
upper_to_m = 1000.0
near_bottom_m = 200.0
factors = [1.0, 0.5, 0.2, 0.3]

# Shared ocean products that replace the provisional stand-ins (mh370-ocean; manifests and sha256 in
# results/ocean-data-manifest.md). Window 80-112 E, 45-18 S covers the 7th-arc posterior mass
# (39.1-23.9 S) with margin; time 7-14 March 2014 is the GridProfile's period, which covers impact
# plus the 48 h float cut-off.
# - column: GLORYS12V1 daily uo, vo, thetao, so on all 50 levels (GridProfile);
# - surface current and wind for the float phase: GLORYS12V1 surface and ERA5 10 m, read for the
#   window and 7-15 March 2014 only (GridField::load_window; about 16 MB). Copernicus-GlobCurrent is
#   the ruled second ocean-model value at equal prior weight (architecture ~07:00, 9 Oct): set
#   surface_current_manifest to its series to run it;
# - seabed: AusSeabed MH370 Phase 1 150 m first, GEBCO_2026 elsewhere;
# - density: TEOS-10 on the column's own T and S ("column"), so density and currents come from one
#   product; the WOA23 climatology is kept loaded as the declared alternative ("woa23").
[hypotheses.settling.shared]
bathymetry_manifests = ["/Users/pete/Downloads/mh370-ocean-data/ausseabed/grid/ausseabed_mh370_150m.json", "/Users/pete/Downloads/mh370-ocean-data/gebco/grid/gebco_2026.json"]
bathymetry_window = [80.0, 112.0, -45.0, -18.0]
density_woa23_manifest = "/Users/pete/Downloads/mh370-ocean-data/woa23/soundspeed/woa23_A5B4_m03.json"
density_source = "column"
column_manifest = "/Users/pete/Downloads/mh370-ocean-data/glorys12/profile/grid/glorys12v1_uo_vo_thetao_so_20140307-20140314.profile.json"
surface_current_manifest = "/Users/pete/Downloads/mh370-ocean-data/glorys12/grid/glorys12v1_uo_vo_surface.series.json"
wind_manifest = "/Users/pete/Downloads/mh370-ocean-data/era5/era5_u10_v10_3h.series.json"
fields_window = [80.0, 112.0, -45.0, -18.0]
fields_time_unix_s = [1394150400.0, 1394841600.0]

# ---------------------------------------------------------------------------------------------
# PROVISIONAL INPUTS the shared crate does not serve yet (provisional.rs). NOT an ocean product
# and NOT a measurement of the region: a closed-form two-layer column and uniform surface fields of
# sensitivity-scale magnitude. The planar seabed and linear density below apply only where
# [shared] does not give a product (tests and the report's controlled depths); [shared] replaces
# both in this run. The column is deleted when the shared owner serves a gridded product column.
# ---------------------------------------------------------------------------------------------
[hypotheses.settling.provisional]
label = "PROVISIONAL analytic column v1 on mh370-ocean - not an ocean product"
# Surface current magnitude = the MEDIAN of the shared crate's GLORYS12V1 top-level daily mean
# for 8 March 2014 over 30-40 S, 88-106 E (0.13 m/s; p90 0.31 m/s is a report sensitivity).
# Direction east is arbitrary: a magnitude, not the field.
surface_current_mps = [0.13, 0.00]
wind_mps = [5.0, 0.0]
stokes_mps = [0.05, 0.0]
upper_current_mps = [0.05, 0.02]
deep_current_mps = [0.02, 0.01]
layer_depth_m = 1000.0
level_spacing_m = 50.0
model_bottom_m = 5500.0

[hypotheses.settling.provisional.seabed]
reference = [92.0, -35.0]
depth_m = 4000.0

[hypotheses.settling.provisional.density]
surface_kg_m3 = 1025.0
gradient_kg_m3_per_km = 5.0
