# SENSITIVITY, never the base: "without Ocean Infinity" = ATSB Phase 2 + Bluefin-21 only.
# Pete's ruling of 13 Oct 2026 (restated 18 Oct 2026) puts both Ocean Infinity campaigns in the base
# (run.toml). This override exists only to report how much the inferred (grade C) Ocean Infinity
# geometry changes each result. Label every product of it: "sensitivity: without Ocean Infinity".
#   mh370 evaluate hypotheses/seabed-search/run.toml hypotheses/seabed-search/without-ocean-infinity.toml <samples> <out>
# Arrays replace rather than extend, so the two campaigns are listed again.
[[hypotheses.seabed-search.campaigns]]
name = "phase2-2014-2017"
layer = "phase2"
detection_probability = 0.945

[[hypotheses.seabed-search.campaigns]]
name = "bluefin-2014"
layer = "bluefin-2014"
detection_probability = 0.9
