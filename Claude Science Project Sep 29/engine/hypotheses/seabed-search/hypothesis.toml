summary = "FULL SCALE on reference-289 (289.7 prior, 12,799,968 impacts, 4 seeds, split-half 0.973 before and 0.968 after): 29.7% of the impact mass lies on ground the ATSB searched and the searches remove 32.0% of the probability at rho 0 (Phase 2 alone 0.2805, Ocean Infinity 2018 alone 0.0400); Z 0.7335 at rho 0.05. The search moves the median 0.20 deg NORTH (-36.78 to -36.58) and leaves 4.4% of the mass on searched ground - the southward shift seen at smoke scale was a property of the under-resolved distribution. OI 2018 is a four-point effect at full scale, not the one point the brief assumed, so its outline provenance now matters. Provisional on end of flight dive class (b), which Pete has asked be rebuilt against Boeing."
