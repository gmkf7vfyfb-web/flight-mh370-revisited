base = "../../config/davey2016.toml"
name = "radar-fix"

# The Malaysian Safety Investigation Report (2018) places the last primary-radar return at
# 18:22:12, 10 NM past MEKAR on N571; Davey Fig. 4.3 marks the end of the radar track there.
# 10 NM along MEKAR->NILAM: 6.5779N 96.3410E. sd 5 NM covers the +/-1 deg azimuth (about
# 4 NM at 250 NM range) and range/plot uncertainty at long range.
[hypotheses.radar-fix]
fixes = [{ epoch = "r1822", unix_s = 1394216532.0, latitude_deg = 6.5779, longitude_deg = 96.3410, sd_nm = 5.0 }]
