# Coverage run (composer ruling 1, 10 Oct 2026): run.toml with release grids on 78-115 E, 45-5 S (runs/pleiades/wide/).
# Identical to run.toml inside the old 85-103 E, 43-25 S box (checked: max |d| = 0.0 deg on every afloat node).
# Base estimate plus this hypothesis. Keys here override the base config.
base = "../../config/davey2016.toml"
name = "pleiades"

[hypotheses.pleiades]
targets = "data/targets-3km.csv"
sd_target_km = 0.5
k_nodes = 8
prior_h = 0.5

# One [[products]] entry per `ocean-model` option, equal prior weight (ocean transport's product
# recommendation, results/ocean-product-recommendation.md; PROVISIONAL until the architect rules).
# GlobCurrent enters through its DAILY table so that the option label equals drift's
# (`globcurrent-my-p1d+era5-wind10`; composition rule 7, joint marginalisation). PROVISIONAL-OVERNIGHT
# (Pleiades tenth entry, P4): the hourly table (sensitivity-globcurrent-pt1h.toml) changes ln S by
# <= 0.012 and the mean shift by <= 0.8 NM on the reference (pooled; every kernel and arm).
# Release tables: deterministic transport from export.rs (gitignored run tree; regenerate with
# `cargo test -p mh370-hypotheses --release -- --ignored pleiades_export`, PLEIADES_CURRENT and
# PLEIADES_EXPORT_TAG selecting the product). Relative to this directory.
#
# Spread: MEASURED, replacing the declared sigma_e 0.05 m/s, T_e 2 d. OU fit per component of the
# GDP replay (results/ocean-transport-error-gdp-replay.json, undrogued, box 80-110E 45-20S, March-May
# starts, current + 1% ERA5). The replay residual against real drifters already contains sub-grid
# dispersion, so the K prior is switched off (k = 0) to avoid counting it twice.
[[hypotheses.pleiades.products]]
release_grid = "../../runs/pleiades/wide/release-grid.toml"
sigma_e_ms = [0.1153, 0.1176]
t_e_days = [6.13, 4.20]
k_min_m2_s = 0.0
k_max_m2_s = 0.0
source = "gdp-replay glorys12+0.01era5 undrogued/box_MAM ou_fit"

[[hypotheses.pleiades.products]]
release_grid = "../../runs/pleiades/wide/release-grid-globcurrent-p1d.toml"
sigma_e_ms = [0.1043, 0.0955]
t_e_days = [16.02, 7.64]
k_min_m2_s = 0.0
k_max_m2_s = 0.0
source = "gdp-replay globcurrent-p1d+0.01era5 undrogued/box_MAM ou_fit"
