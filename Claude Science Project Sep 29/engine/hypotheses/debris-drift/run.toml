# Base estimate plus this hypothesis. Keys here override the base config.
base = "../../config/davey2016.toml"
name = "debris-drift"

# SYNTHETIC FINDS ON ANALYTIC FIELDS (ocean::analytic). Code path only: never evidence.
# The evidence configuration is pilot.toml.
[hypotheses.debris-drift]
mode = "synthetic"
coverage = 0.99
spacing_nm = 10.0
# Stand-in for the descent reach until impact samples exist (Pleiades measured up to 103 NM).
margin_nm = 100.0
island_link_nm = 40.0
include_island = false
particles_per_class = 1000
seed = 1
# The 00:19:37 epoch (2014-03-08). First pass releases at the impact point at this time.
release_unix_s = 1394237977.0
dt_hours = 6.0
threads = 2
env_seeds = [1, 2, 3]

[hypotheses.debris-drift.transport]
kind = "analytic"
current_mps = [-0.2, 0.02]
wind10_mps = [-3.0, 2.0]
# A meridian coast at 80 E, land to the west.
coast_a = [80.0, -60.0]
coast_b = [80.0, 0.0]
land_left = true

[hypotheses.debris-drift.diffusivity]
kind = "fixed"
k_m2_s = 248.0

[[hypotheses.debris-drift.classes]]
name = "test"
motion_classes = []
a_stokes = { dist = "fixed", value = 0.0 }
c_wind = { dist = "normal", mean = 0.012, sd = 0.003, lo = 0.005, hi = 0.02 }
leeway_angle_deg = { dist = "fixed", value = 0.0 }
leeway_speed_mps = { dist = "fixed", value = 0.0 }

[hypotheses.debris-drift.recovery]
bandwidth_km = 25.0
delay = "exponential"
delay_days = 60.0
period_breaks = ["2015-07-29", "2016-03-01"]
window_end = "2016-06-30"
segment_edges_km = [0.0, 550.0, 1100.0, 1650.0, 2200.0, 2750.0, 3300.0, 3850.0, 4400.0, 4950.0, 5500.0, 6050.0, 6600.0]

[hypotheses.debris-drift.levels]
ln_mean_by_period = [-2.302585, -0.693147, 0.0]
sigma = 1.0
draws = 64
seed = 3

[hypotheses.debris-drift.synthetic]
true_lat_deg = -37.2
true_lon_deg = 95.0
finds = 9
seed = 11
