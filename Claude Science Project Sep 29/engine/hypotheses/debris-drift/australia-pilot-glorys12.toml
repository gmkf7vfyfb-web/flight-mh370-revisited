# NOT RUN (Pete 12 Oct ~14:50 UTC: after run I). Australian non-recovery pilot, GLORYS12, every 4th of the 710 run A nodes.
# Before running: extend domain to 160 E and point the manifests at the extended fields (ocean transport request, 12 Oct).
# run A (glorys12, chunk 0 of 4): 96 nodes
# PRODUCTION (step 4 sizing; NOT YET RUN - step 6 waits for the final impact samples, and the start
# of any long run is announced first). Sizing from results/debris-drift-production-sizing.md:
# 30 NM spacing (correlation length not resolved; the surface changes by < ~2 ln units over
# ~100-165 NM; 367 nodes on reference-289), 10^5 particles per node (4 environment realisations x 3 classes x 8,334), measured
# ocean error, the shared GSHHG coastline (4eba004), importance splitting for Rodrigues and Mossel Bay.
# PROVISIONAL-OVERNIGHT (9 Oct overnight rule): the ocean-error length scale (100 km, assumed), the
# K prior range and the splitting settings. Pete reviews these in the morning.
base = "../../config/davey2016.toml"
name = "debris-drift-production-glorys12"

[[compose]]
id = "drift"
modules = ["debris-drift"]

[hypotheses.debris-drift]
mode = "evidence"
# Extent from reference-289 (289.7 deg prior, delivered 13:48 UTC; architecture entry ~14:45 UTC):
# 99% of 00:19:37 mass, one connected band, 367 nodes at 30 NM (193 on the superseded 295.66 map).
extent_map_path = "debris-drift/data/reference-map-reference-289-m0019b.csv"
coverage = 0.99
spacing_nm = 30.0
margin_nm = 100.0
island_link_nm = 40.0
include_island = false
particles_per_class = 8334
seed = 1
release_unix_s = 1394237977.0
dt_hours = 6.0
threads = 12
domain = [15.0, 120.0, -50.0, 0.0]
land_gap_is_beaching = false
# CSIRO's implicit system (ruling D-b): the wind fraction carries Stokes; no Stokes field.
leeway_absorbs_stokes = true
explicit_residual = false
env_seeds = [1, 2, 3, 4]
output_dir = "../runs/debris-drift-australia-pilot-glorys12"
node_subset = [2, 6, 10, 14, 42, 46, 50, 54, 81, 85, 89, 93, 118, 122, 126, 130, 154, 158, 162, 166, 170, 193, 197, 201, 205, 209, 231, 235, 239, 243, 247, 270, 274, 278, 282, 286, 307, 311, 315, 319, 323, 344, 348, 352, 356, 360, 364, 385, 389, 393, 397, 401, 405, 424, 428, 432, 436, 440, 444, 462, 466, 470, 474, 478, 482, 499, 503, 507, 511, 515, 519, 537, 541, 545, 549, 553, 557, 576, 580, 584, 588, 592, 596, 615, 619, 623, 627, 631, 635, 654, 658, 662, 666, 670, 674, 694, 698, 702, 706, 710, 714, 734, 738, 742, 746, 750, 770, 774, 778, 782, 786, 790, 812, 816, 820, 824, 828, 852, 856, 860, 864, 868, 892, 896, 900, 904, 929, 933, 937, 941, 945, 970, 974, 978, 982, 1008, 1012, 1016, 1020, 1024, 1049, 1053, 1057, 1061, 1087, 1091, 1095, 1099, 1124, 1128, 1132, 1136, 1162, 1167, 1171, 1175, 1205, 1209, 1213, 1244, 1248, 1252, 1283, 1287, 1291, 1323, 1327, 1359, 1363, 1367, 1400, 1404, 1438, 1442, 1477, 1481, 1518, 1556]
node_subset_outside_extent = true

# The CSIRO-system arm on GLORYS12 + ERA5 (a declared alternative; BRAN2016, the reproduction
# setting, is held on its licence - Pete's decision). Series manifests from ocean transport item 2
# (`4f58d5d`), 7 Mar 2014 - 31 Jan 2017, joined across file seams by GridField::load_series.
[hypotheses.debris-drift.transport]
kind = "grid"
current_manifest = "/Users/pete/Downloads/mh370-ocean-data/glorys12/grid/glorys12v1_uo_vo_surface.series.json"
wind10_manifest = "/Users/pete/Downloads/mh370-ocean-data/era5/era5_u10_v10_3h.series.json"
# The shared GSHHG 2.3.7 full-resolution coastline (ocean transport deliverable 6, 4eba004; Wessel
# and Smith 1996; LGPL-3.0; sha256 af9215d5... in results/ocean-data-manifest.md). Land-mask
# strandings within 25 km of the shore snap to it (declared, transport's default); any remaining
# land gap is model error, not beaching (land_gap_is_beaching = false, above).
gshhg_path = "/Users/pete/Downloads/mh370-ocean-data/gshhg/gshhs_f.b"
gshhg_snap_km = 25.0

# K is the sub-mesoscale part only (ruling 4: marginalised under the shared DiffusivityPrior, one
# draw per environment seed). PROVISIONAL-OVERNIGHT range: log-uniform 100-1,000 m2/s, spanning the
# old code's 100 and CSIRO's 248 (Part III p. 6).
[hypotheses.debris-drift.diffusivity]
kind = "log-uniform"
k_min_m2_s = 100.0
k_max_m2_s = 1000.0

# Measured transport error (ruling of 9 Oct ~07:00 UTC; results/ocean-transport-error-gdp-replay.md,
# GLORYS12 + 1% ERA5 on undrogued drifters in the search box, March-May: sigma E/N 0.115/0.118 m/s,
# T 6.1/4.2 d). Not double-counted with K: sigma_eff^2 = sigma^2 - K_ref/T with K_ref = 248 m2/s,
# so the single-particle spread at the reference K equals the replay's (K is 4% of sigma^2 T).
# Length scale: NOT measured by the replay; 100 km assumed (PROVISIONAL-OVERNIGHT), sensitivity 50/200.
[hypotheses.debris-drift.ocean_error]
sigma_m_s = 0.1146
length_scale_km = 100.0
time_scale_days = 5.1

# Ruling D-a: flaperon speed and angle are measurements (CSIRO Part II pp. 10, 17), in CSIRO's
# system (D-b). Ruling D-f (landed in the shared API, wind_angle_deg): the measured angle rotates
# only the extra leeway (Part II p. 13, Fig. 3.1 caption); the 1.2% term is downwind
# (wind_angle_deg default 0). Angle sign is the shared API's: positive clockwise, so "left" < 0.
[[hypotheses.debris-drift.classes]]
name = "flaperon"
motion_classes = ["flaperon"]
a_stokes = { dist = "fixed", value = 0.0 }
c_wind = { dist = "fixed", value = 0.012 }
leeway_angle_deg = { dist = "uniform", lo = -30.0, hi = 0.0 }
leeway_speed_mps = { dist = "normal", mean = 0.10, sd = 0.03, lo = 0.0, hi = 1.0 }

# Review section 4.1, implicit form; CSIRO Part III p. 6 (1.2% items "subject to Stokes Drift but
# not direct wind forcing"). PROVISIONAL priors.
[[hypotheses.debris-drift.classes]]
name = "low_exposure_exterior"
motion_classes = ["low_exposure_exterior"]
a_stokes = { dist = "fixed", value = 0.0 }
c_wind = { dist = "normal", mean = 0.012, sd = 0.003, lo = 0.005, hi = 0.02 }
wind_angle_deg = { dist = "normal", mean = 0.0, sd = 10.0, lo = -90.0, hi = 90.0 }
leeway_angle_deg = { dist = "fixed", value = 0.0 }
leeway_speed_mps = { dist = "fixed", value = 0.0 }

[[hypotheses.debris-drift.classes]]
name = "high_windage_interior"
motion_classes = ["high_windage_interior"]
a_stokes = { dist = "fixed", value = 0.0 }
c_wind = { dist = "log-normal", median = 0.025, sigma = 0.35, lo = 0.01, hi = 0.05 }
wind_angle_deg = { dist = "normal", mean = 0.0, sd = 15.0, lo = -90.0, hi = 90.0 }
leeway_angle_deg = { dist = "fixed", value = 0.0 }
leeway_speed_mps = { dist = "fixed", value = 0.0 }

# Detection segments S1-S6 of results/debris-drift-find-episodes.md, as lon/lat boxes
# [lon_min, lon_max, lat_min, lat_max] wide enough to hold land-mask stranding points. PROVISIONAL
# until the transport's real coastline and segmentation exist. Coasts outside every box carry no
# identification (brief section 13 defers the Western Australia term).
[[hypotheses.debris-drift.segments]]
name = "S1-reunion"
boxes = [[55.1, 56.0, -21.5, -20.7]]

[[hypotheses.debris-drift.segments]]
name = "S2-mauritius-rodrigues"
boxes = [[57.2, 57.9, -20.7, -19.8], [63.2, 63.65, -19.9, -19.55]]

[[hypotheses.debris-drift.segments]]
name = "S3-southern-mozambique"
boxes = [[33.5, 36.0, -25.3, -21.3]]

[[hypotheses.debris-drift.segments]]
name = "S4-south-africa-south-coast"
boxes = [[20.0, 26.5, -34.9, -33.6]]

[[hypotheses.debris-drift.segments]]
name = "S5-ne-madagascar"
boxes = [[49.0, 50.8, -18.0, -15.4]]

[[hypotheses.debris-drift.segments]]
name = "S6-pemba"
# Trimmed west edge 39.3 -> 39.45 E so the block is Pemba only: transport reported that the pilot box
# took in ~25 km of Tanzanian mainland on GSHHG (OCEAN_TRANSPORT.md, coastline entry, 9 Oct).
boxes = [[39.45, 40.3, -5.6, -4.6]]

# G1 periods: I1 before 29 Jul 2015 | I2 to end Feb 2016 | I3 Mar-Jun 2016. Delay exponential,
# mean 60 d, declared a priori (never chosen to fit); sensitivity at 30 and 120 d.
# Bandwidth: locality point versus first-beaching point, as explicit model error. 50 km covers the
# land-mask stranding offset (<= ~10 km at 1/12 deg), locality coordinates that are beach or town
# points (DEBRIS-EVIDENCE.md), and unmodelled along-shore movement after beaching (no refloat in the
# first pass). 25, 100 and 200 km are reported from the same ensembles as sensitivities.
# Australian coasts with no finds (brief section 13, raised by Pete 12 Oct 2026: all of Australia). Boxes hold
# GSHHG coastline points only; north edges keep Rote, Timor and the Torres Strait islands out. PROVISIONAL.
[[hypotheses.debris-drift.segments]]
name = "S7-australia-south-west"
boxes = [[112.5, 116.0, -35.2, -26.0], [115.0, 122.5, -35.3, -33.5]]

[[hypotheses.debris-drift.segments]]
name = "S8-australia-north-west-north"
boxes = [[112.5, 124.0, -26.0, -13.0], [124.0, 142.5, -26.0, -10.8]]

[[hypotheses.debris-drift.segments]]
name = "S9-australia-south"
boxes = [[122.5, 150.0, -39.5, -31.0]]

[[hypotheses.debris-drift.segments]]
name = "S10-australia-tasmania"
boxes = [[143.5, 149.0, -44.0, -39.5]]

[[hypotheses.debris-drift.segments]]
name = "S11-australia-east"
boxes = [[142.5, 154.5, -31.0, -10.0], [150.0, 154.5, -39.5, -31.0]]

[hypotheses.debris-drift.recovery]
bandwidth_km = 50.0
extra_bandwidths_km = [25.0, 100.0, 200.0]
delay = "exponential"
delay_days = 60.0
period_breaks = ["2015-07-29", "2016-03-01"]
window_end = "2016-06-30"

# G1 level prior, PROVISIONAL pending the architect's values: ln nu ~ N(mu_I, 1), mu = ln 0.1,
# ln 0.5, ln 1 for I1, I2, I3 (effort rising after the flaperon), independent by block.
# Australian level options (results/debris-drift-australia-nonrecovery-design.md). Primary ln_l = A: Australian
# segments take ln_mean_by_period, the same as the find coasts in each period. Alternatives B, C, off share the ensembles.
[hypotheses.debris-drift.levels]
ln_mean_by_period = [-2.302585, -0.693147, 0.0]
sigma = 1.0
draws = 256
seed = 3

# Importance splitting (fbaad33, 84b6f85): unbiased; sized on the 9 Oct diagnostics
# (results/debris-drift-production-sizing.md). PROVISIONAL-OVERNIGHT settings.
[[hypotheses.debris-drift.levels.alternatives]]
name = "B"
segment_ln_mean_by_period = [
  { segment = "S7-australia-south-west", ln_mean_by_period = [0.0, 0.0, 0.0] },
  { segment = "S9-australia-south", ln_mean_by_period = [0.0, 0.0, 0.0] },
  { segment = "S8-australia-north-west-north", ln_mean_by_period = [-1.203973, -1.203973, -1.203973] },
  { segment = "S10-australia-tasmania", ln_mean_by_period = [-1.203973, -1.203973, -1.203973] },
  { segment = "S11-australia-east", ln_mean_by_period = [-1.203973, -1.203973, -1.203973] },
]

