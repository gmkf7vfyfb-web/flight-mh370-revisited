manifest_version: 1
purpose: Declarative import manifest for hydro_data.sqlite (stage 3, build_imports.py). From 26 Oct 2026 a thread adds data by adding one block here and rebuilding; never by editing the database.
roots:
  WORK: '''Claude Science Project Sep 29'' folder of a claude-science-sep29 checkout (--work)'
  MOD: module root on hypothesis/hydroacoustics (--mod)
kinds:
  table: 'CSV copied verbatim to a new table; checks: rows, SHA-256, units for every numeric column, unique key'
  table_concat: several CSV files with the same columns into one table
  noise_percentiles: verbatim table plus one noise_estimate row per percentile column (quantity and unit from noise.quantity_map)
  array_calibration: 'JSON array calibration: table array_calibration (parameters), array_calibration_event (events), attribute rows on the site'
  coupling_package_append: rows appended to the coupling package tables after the package validator passes on base plus new rows; updates keep the old row in package_row_history
blocks:
- id: imp_ims_march_noise_percentiles
  path: WORK:results/hydroacoustics/source-survey-2026-10-23/next-steps-2026-10-24/ims-march-noise-percentiles.csv
  branch: claude-science-sep29
  commit: 114bebc805582ce95d3472a599d1c1b09b0f41cc
  sha256: 1b36c6c2755f0185a5dd4287733b9f5a728b942539a5b5080ec08fd79006075b
  kind: noise_percentiles
  table: ims_march_noise_percentile
  registry_id: res.next_steps_2026_10_24
  role: background (same-season proxy, open raw IMS 2015-2019)
  caveat: 'Other years (March 2015-2019) are a proxy for 8 March 2014; the 2014 IMS records are not open at EarthScope (producer note ims-open-march-background-note.md). Exploratory: no likelihood.'
  units:
    freq_hz: Hz
    n_minutes: count
    p5: from column quantity
    p25: from column quantity
    p50: from column quantity
    p75: from column quantity
    p95: from column quantity
  key:
  - source
  - station
  - element
  - subset
  - quantity
  - freq_hz
  noise:
    context: IMS March 2015-2019 open raw (proxy for 8 Mar 2014)
    method: measured from raw recording (EarthScope, response removed)
    source_id: earthscope_ims_open
    averaging: Welch PSD per UTC minute (Hann, 4 s, 50 % overlap); percentile over element-minutes
    quantity_map:
      psd_1hz_db_re_1uPa2_per_Hz:
      - band_mean_psd
      - 1 Hz bin
      third_octave_mean_psd_db_re_1uPa2_per_Hz:
      - band_mean_psd
      - 1/3 octave
      third_octave_spl_db_re_1uPa:
      - rms_level
      - 1/3 octave
      band_spl_5_40Hz_db_re_1uPa:
      - rms_level
      - 5-40 Hz
    stat_map:
      p5: p5
      p25: p25
      p50: median
      p75: p75
      p95: p95
    quantities_to_noise_estimate:
    - third_octave_mean_psd_db_re_1uPa2_per_Hz
    - third_octave_spl_db_re_1uPa
    - band_spl_5_40Hz_db_re_1uPa
    note: The 1-Hz PSD percentiles stay in the verbatim table ims_march_noise_percentile only (database size); band quantities go to noise_estimate.
