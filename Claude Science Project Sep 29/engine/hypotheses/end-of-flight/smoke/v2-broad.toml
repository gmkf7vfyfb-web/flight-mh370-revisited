# V2 profile coverage, PROVISIONAL-OVERNIGHT (Pete, 10 Oct ~03:50 UTC: the V2 descents "do not look randomly initiated
# post 22:41 ... very concentrated later", and the 10,000 ft and 4,000 ft and typical level-offs are undersampled).
# Measured on eof-2241-tr-v2-s1 (prior): only 4% of onsets in 22:41-22:56; half of all descents free trim; 16% with any
# level segment; 2.8% / 1.7% with a level-off at 10,000 / 4,000 ft. Applied to BOTH arms (V1b and V2) so the arm
# comparison stays like for like; the deliberate-onset control weights only act on V2's anticipatory / fuel-cue onsets.
# Reversible: drop this overlay to return to the earlier envelope.
[hypotheses.end-of-flight]
# A crew that chose to descend is in control at the start: ditching attempt (controlled to the surface) or
# maintained-then-lost, never free trim. Control.ALL order: ditching, maintained-then-lost, no intervention, upset.
deliberate_control_weights = [0.6, 0.4, 0.0, 0.0]

[hypotheses.end-of-flight.onset]
# Uniform onset on [22:41, cruise-predicted exhaustion]: the support is truncated exactly at the hand-off, so a
# 150-min nominal lead (exhaustion up to 01:11) makes the onset uniform over the whole available window.
anticipatory_lead_s = [0.0, 9000.0]

[hypotheses.end-of-flight.envelope]
# Planned profiles get flown before any loss of control.
control_loss_after_s = [30.0, 5400.0]
# More stepped descents, more second level-offs; candidates 10,000 ft, 4,000 ft and an intermediate step-down level.
powered_shape_weights = [0.25, 0.5, 0.25]
second_leveloff_probability = 0.6
leveloff_altitude_ft = [11000.0, 30000.0]
