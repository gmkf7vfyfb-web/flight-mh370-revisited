# G-turn: piloted turns after the onset (Pete's rulings 12 Oct 2026: full turn model, no fixed cap; Davey sampling until about
# 25 min before impact; sweep and circuit not exclusive; random turns rather than a sun term). PROVISIONAL, for run I.
# Before the terminal window: Davey et al. (2016) turns, Poisson with time constant tau on a Jeffreys prior over 0.1-10 h (the
# core's prior; interim until the core passes each particle's own tau), angle uniform on the circle.
# Terminal window (time to go at the present descent rate <= 25 min, or the ditching approach): random turns at a rate drawn
# log-uniform from 1/h to 1 per 2 min (no cap on the count), angle uniform; a search sweep of 1-3 orbits (proposal 0.5 = marginal
# of a U[0, 1] hyper-prior) starting 0-15 min into the window; a ditching circuit (ditching attempts; proposal 0.5) at the
# approach: downwind 1-5 min, base 0.5-2 min, final into the wind or along the swell (across the wind, swell proxy) 0.5 / 0.5.
# Bank 10-30 deg (rate-one to steep turns). Piloted laws only; free flight keeps its residual bank.
[hypotheses.end-of-flight.envelope]
davey_tau_range_h = [0.1, 10.0]
terminal_window_s = 1500.0
turn_log_rate_per_min = [-4.0943445622221, -0.6931471805599453]
turn_bank_deg = [10.0, 30.0]
sweep_probability = 0.5
sweep_window_s = [0.0, 900.0]
circuit_probability = 0.5
circuit_downwind_s = [60.0, 300.0]
circuit_base_s = [30.0, 120.0]
