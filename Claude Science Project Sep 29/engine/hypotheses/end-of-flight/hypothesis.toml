# Metadata for this hypothesis. Keep it current; the report prints it.
question = "How much of the uncertainty in impact position, time and energy comes from the end of flight itself, once descent initiation, propulsion state and subsequent control are sampled as three independent axes and the descent profile is sampled from an envelope rather than assumed?"
# open | supported | not-supported | inconclusive
status = "open"
# One line, written when the question is answered, citing the run that answered it.
summary = "First code increment only: taxonomy, point-mass integrator, sampled descent envelope, descent-onset latent and a Terminal implementation, all unit-tested (49 new tests, 57 passing in this crate; clean (L/D)max pinned to 20.8-21.4, unpowered glide 85-105 NM from 35,000 ft, phugoid period within 0.1% of pi*sqrt(2)*V/g under that formula's own constant-density assumption, BFO vertical-rate sensitivity 17.81 Hz per 1,000 ft/min at the 00:11 arc against 17.52 at the 7th arc). The only run made is one smoke-scale code-path check (runs/smoke-end-of-flight, seeds 1-2), whose terminal module was still arc-kernel and whose impacts.npy therefore contains nothing from this model; smoke runs are never evidence. So there is no impact PDF, no V1/V2 comparison and no calibration against the Boeing simulator runs. Selecting this module as the terminal model needs core request 6; trusting any number it produces needs core request 1."

# Changes needed in the core (new hooks, new state fields). Leave empty if none.
# A hypothesis agent writes requests here and stops; it never edits core code.
core_requests = [
  "1. crates/mh370/src/terminal.rs, fn flight_state (lines 396-416): pass the fuel state through to the terminal module. It currently hard-codes mass_kg, fuel_kg and fuel_exhaustion_unix_s to NaN even though crates/flight carries Aircraft::fuel_kg and Aircraft::fuel_exhausted_unix_s and the fuel model is built. Without them the anticipatory and fuel-cue onset mechanisms have no predicted endurance to trigger on and the integrator has no wing loading, so this module runs on configured fallbacks (fallback_mass_kg, fallback_fuel_kg, fallback_predicted_exhaustion_unix_s) and every result is provisional. fuel_exhaustion_unix_s must be the predicted exhaustion under CONTINUED CRUISE at the hand-off, not a realised value; if the core cannot predict forward, add a separate predicted_exhaustion_unix_s field and say which is which.",
  "2. crates/hypothesis/src/lib.rs, trait Terminal: let descend() see what takeover_time() drew. Either pass takeover_time's return value (or a module-defined latent vector) into descend, or merge the two hooks. Today the two hooks have separate uniform streams, so the onset mechanism and the support-truncation fraction drawn in takeover_time are not available in descend; this module recovers the mechanism exactly from the conditional posterior p(mechanism | onset lead), which is correct but costs a density evaluation per descent and cannot recover the truncation fraction at all (the onset_support_truncated_fraction latent is NaN for that reason). Also: the doc comment and the impacts.npy column call takeover_time 'the first flame-out'. With an anticipatory or fuel-cue onset the takeover is the descent ONSET and is earlier than any flame-out; please redocument it as the module takeover time.",
  "3. crates/hypothesis/src/lib.rs: give the terminal module the core's fuel-flow model, e.g. a `fn fuel_flow_kg_h(&self, flight_level: f64, weight_t: f64, mach: f64) -> Option<f64>` on a trait the runner implements, as it already does for Atmosphere. A hypothesis may depend only on hypothesis, geo, serde and toml, so it cannot read data/fuel-tables.json or call crates/flight. This module therefore burns fuel through a TSFC approximation (tsfc_kg_per_n_s, swept 1.4e-5 to 1.8e-5), which is NOT the Boeing-calibrated FPPM tables the cruise phase uses. Section 5 of the end-of-flight brief requires a trajectory that fitted 00:11 to be RE-SCORED rather than extended, and that cannot be honest while the descent burn and the cruise burn come from different models.",
  "4. crates/hypothesis/src/lib.rs, struct ImpactView: add the fields the downstream modules need. Confirmed missing: attitude beyond flight_path_angle_deg (settling and debris need bank and pitch at contact), the dissipation duration tau for the hydroacoustic source term, a debris class, and a sink-versus-float flag. The last two exist in this module as the deferred-hook latents debris_class and sinks_not_floats, always NaN; latents are readable only by this module's own impact hook, so hydroacoustics, settling and drift cannot see them. Also add realised_flameout_unix_s: it is a latent here for the same reason, and the log-on lag likelihood will need it from outside this module.",
  "5. crates/mh370/src/terminal.rs, impl Atmosphere for Weather (line 380): surface_pressure_altitude_ft is hard-coded to 0.0, although the hypothesis::Air doc comment says it comes from ERA5 mean-sea-level pressure where the grid carries it, and a descent ends there. Every impact in this module therefore terminates at ISA sea level. The error is small (a 10 hPa anomaly is about 280 ft) but it is a systematic bias on impact time and vertical speed, so please either wire the MSLP field in or change the doc comment to say the surface is ISA sea level.",
  "6. config/integrated.toml (core-owned): this module cannot be selected as the terminal model from inside hypotheses/. Selecting it needs `[terminal] module = \"end-of-flight\"` plus a `[hypotheses.end-of-flight]` block in a core-owned config, which is out of scope here, so the Terminal implementation is exercised by this module's own unit tests rather than through the runner. hypotheses/end-of-flight/run.toml carries the parameter block ready to be lifted.",
  "7. The weather grid stops at 43,000 ft and at 02:00 UTC. A free-dynamics phugoid from a high-speed upset can climb above 43,000 ft; the integrator records max_altitude_ft and carries the runner's Air::clamped flag through to the weather_clamped latent rather than hiding it, but a grid to about 60,000 ft would remove the clamping. Raising this now as the brief's pitfall list asks, not requesting it yet: this model has never been the terminal module in a run, so there is no measured rate of clamped descents to justify the cost."
]
