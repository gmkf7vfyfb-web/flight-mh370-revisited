  "2. DONE, landed in 52ce1ca and adopted here. takeover() carries the onset mechanism, lead, truncation fraction and hand-off prediction in Takeover::draw; descend_after() reads them and never recomputes from the core-propagated state. The former ignored test the_flameout_mechanism_survives_the_cores_propagation is now the passing acceptance test, with a control showing the legacy path still loses the mechanism. mechanism_from_draw records the path per sample.",
  "3. DONE, landed in 52ce1ca and adopted here for POWERED FLIGHT. The burn at any thrust is thrust x (table cruise flow / this module's level-flight drag at the same flight level, weight and Mach): exact in level cruise, scaled by thrust elsewhere; it understates idle flow and treats one engine at a given thrust like two sharing it, both declared. None is never zero flow: those seconds burn at the module's own TSFC and are recorded in fuel_unpriced_s; fuel_below_tables_s and fuel_extrapolated_s are carried as asked. FOLLOW-UP, request 3b: takeover() receives no FuelFlow, so the PREDICTED exhaustion that triggers onset is still priced by this module's TSFC (5,033 against 5,764 kg/h at the fixture state). Please pass &dyn FuelFlow to takeover() as well, so the onset trigger and the burn share one model.",
  "4. crates/hypothesis/src/lib.rs, struct ImpactView: lift this module's impact latents into the view so the impact-level modules can read them as fields. Architecture ruled the names on 2026-10-08 and they are emitted here now: impact_heading_deg, impact_bank_deg, impact_energy_transferred_j, energy_transfer_t05_s, energy_transfer_t95_s, energy_transfer_tau90_s, energy_transfer_peak_rate_w, energy_transfer_n_pulses, impact_tau_method, plus debris_class with breakup_p_intact/broken/fragmented (settling's breakup rule, accepted as the contract 2026-10-09) and realised_flameout_unix_s. sinks_not_floats is retired (2026-10-09 ruling: settling owns the partition through its element fates). Latents are readable only by this module's own impact hook, so settling, drift and hydroacoustics cannot see any of them until this lands. NOT wanted: a kinetic_energy_at_contact_j field. Kinetic energy at contact is already ImpactView::kinetic_energy_j, computed by the runner at terminal.rs:263 as 0.5*m*|v|^2 from this module's own Impact, with vertical_kinetic_energy_j beside it; a second name for it would be an alias, and it is an upper bound on impact_energy_transferred_j rather than the same quantity. Method and conventions: results/eof-impact-energy-method.md. UPDATE 9 Oct (deliverable 5): prefer the by-name latent accessor in core's consolidated request 4 (ImpactView::latent(name) -> Option<f64>, names from Terminal::latent_columns) over one field per latent; it then carries, with no further struct change, spiral_divergent and spiral_doubling_s (the PROVISIONAL-OVERNIGHT dive class, so settling and hydroacoustics can condition on it), free_dynamics_started_s, last_burst_latitude_deg / last_burst_longitude_deg (Pleiades section 11 displacement), and onset_mechanism (so V1/V2 arms can be split downstream). Contact pitch is not modelled (point mass): flight_path_angle_deg stands in, declared.",
  "5. crates/mh370/src/terminal.rs, impl Atmosphere for Weather (line 380): surface_pressure_altitude_ft is hard-coded to 0.0, although the hypothesis::Air doc comment says it comes from ERA5 mean-sea-level pressure where the grid carries it, and a descent ends there. Every impact in this module therefore terminates at ISA sea level. The error is small (a 10 hPa anomaly is about 280 ft) but it is a systematic bias on impact time and vertical speed, so please either wire the MSLP field in or change the doc comment to say the surface is ISA sea level.",
  "6. config/integrated.toml (core-owned): this module cannot be selected as the terminal model from inside hypotheses/. Selecting it needs `[terminal] module = \"end-of-flight\"` plus a `[hypotheses.end-of-flight]` block in a core-owned config, which is out of scope here, so the Terminal implementation is exercised by this module's own unit tests rather than through the runner. hypotheses/end-of-flight/run.toml carries the parameter block ready to be lifted.",
  "7. The weather grid stops at 43,000 ft and at 02:00 UTC. A free-dynamics phugoid from a high-speed upset can climb above 43,000 ft; the integrator records max_altitude_ft and carries the runner's Air::clamped flag through to the weather_clamped latent rather than hiding it, but a grid to about 60,000 ft would remove the clamping. Raising this now as the brief's pitfall list asks, not requesting it yet: this model has never been the terminal module in a run, so there is no measured rate of clamped descents to justify the cost.",
  "8. PROPOSED (core request 14; number for the architect to confirm). crates/mh370/src/terminal.rs: score CRUISE BFOs after the stop, so arms V1b and V2 can run from the 22:41 hand-off. Today Stage::new refuses any BFO option when more than two bursts follow the stop ('the 00:19 BFO models cover two bursts'), and log_likelihood indexes the 00:19 contacts by epoch POSITION (contacts[k], k in 0..2). From 22:41 the bursts after the stop are m2315 (BFO only), m0011, m0019a and m0019b. Asked: (i) for each in-stage burst with cruise_bfo set, apply the filter's own sequence to a per-child copy of the handed-off bias, i.e. BfoBias::drift over the gap when drift_hz2_per_s is set, then BfoBias::update(predicted, z, sd), adding its marginal log-likelihood, with the vertical rate when params.bfo_vertical_rate is set, exactly as filter.rs does; (ii) pass the bias as updated through the cruise bursts to the 00:19 BFO models; (iii) identify the 00:19 contacts by epoch id (m0019a, m0019b), not by position. Acceptance: the 00:11 hand-off is byte-identical to today; a unit test shows that scoring m0011 in-stage reproduces the filter's m0011 BFO increment for the same state and bias. Without it the 22:41 arms can score BTO only, and the 00:11 BFO, which sets the autopilot-mode mixture at about 20:1 (brief section 5), is missing. BTO-only V1b/V2 smoke runs are queued meanwhile and labelled NOT THE ARM.",
  "9. PROPOSED (number for the architect to assign; 15 is taken). crates/mh370/src/terminal.rs ~244: an option to weight a parent's descents UNNORMALISED, row.weight x exp(q_i) / n, instead of self-normalising them over the parent (today: row.weight x exp(q_i) / sum_j exp(q_j)). E[exp q] = 1 under any exact proposal, so the unnormalised form is unbiased, and the per-seed weights still sum to 1 in expectation (proposal_self_check already measures it). The self-normalised form is a ratio estimator with O(1/n) bias when q varies: on the two-burst stopgap smoke (n = 4 descents per parent) it raised ln Z by 0.28 on R1200 (13 bootstrap s.e.) and 0.56 on both/inflated; recomputing unnormalised recovers the prior-sampled ln Z to 0.01-0.03. On today's runs the bias is negligible (<= 0.01, takeover correction sd 0.19), so the default can stay. Acceptance: with the option off, outputs byte-identical; with it on and no proposal active, identical to within float rounding; a unit test with a known proposal recovers the prior mean. Until it lands this module's proposal stays off (full/two-burst-proposal.toml says so). results/eof-two-burst-oct09/README.md section 4.",
  "10. PROPOSED (number for the architect to assign). Hand-off boundary: a look-ahead (auxiliary) resampling of the 00:11 hand-off, Searched Areas' item (iii), ~22:35 entry, 9 Oct. Draw the parents handed to the terminal stage proportional to cruise weight x a cheap approximation g of the 00:19 likelihood, and carry ln(1/g) as each parent's correction, so the posterior is unchanged and only which states get children changes. Measured need: Holland's two two-burst arms are parent-limited on reference-289 (effective impacts = effective parents: 4-20 for no-offset, 8-78 for startup-offset per seed); 9-14% of hand-off weight even flames out inside the log-on lag window. This module would supply g (e.g. a per-parent pilot of a few descents scored on both bursts, or a closed-form reachability of the m0019a BTO ring from the 00:11 state), core owns the resampling. Ceiling: the feasible fraction of the cruise filter's full particle set, not of the 100,000 handed off."
