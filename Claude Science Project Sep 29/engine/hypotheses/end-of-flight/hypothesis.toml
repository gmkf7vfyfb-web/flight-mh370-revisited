# Metadata for this hypothesis. Keep it current; the report prints it.
question = "How much of the uncertainty in impact position, time and energy comes from the end of flight itself, once descent initiation, propulsion state and subsequent control are sampled as three independent axes and the descent profile is sampled from an envelope rather than assumed?"
# open | supported | not-supported | inconclusive
status = "open"
# One line, written when the question is answered, citing the run that answered it.
summary = "SMOKE ONLY - plumbing, not evidence. First impacts from this model's own dynamics, 9 Oct, runs/eof-term-n4 off a rebuilt 20k-per-mode seed-1 hand-off at 00:11 (2,000 rows), N = 4 children, 32,000 descents in 21.8 s at 2 threads. Passed: every parent has impacts; no fallback fired; 42 latents present, none unexpectedly NaN; proposal self-check 0.9997 +/- 0.0025. FAILED, and blocking: the onset MECHANISM is mislabelled for flame-out draws - descend recomputes the lead from a state the core has propagated on its own higher burn, never recovers a lead of exactly zero, and labels 53.1% of the weight anticipatory with zero prior; flame-out-associated families are absent. Core request 2 is now a blocker (pinned by the ignored test the_flameout_mechanism_survives_the_cores_propagation). Burn gap measured twice: 5,033 against 5,764 kg/h, and 53.1% of children flown powered by the core after its own tanks were dry, median 43 s. Strict data options collapse at N = 4 (both: 1.0-1.1 effective parents) - not resolved. No impact PDF, no V1a/V1b/V2 comparison, no Boeing simulator calibration."

