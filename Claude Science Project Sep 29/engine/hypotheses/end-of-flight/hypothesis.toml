# Metadata for this hypothesis. Keep it current; the report prints it.
question = "How much of the uncertainty in impact position, time and energy comes from the end of flight itself, once descent initiation, propulsion state and subsequent control are sampled as three independent axes and the descent profile is sampled from an envelope rather than assumed?"
# open | supported | not-supported | inconclusive
status = "open"
# One line, written when the question is answered, citing the run that answered it.
summary = "FULL SCALE on reference-289 (289.7 prior), 9 Oct: 00:11 hand-off, 4 seeds x 100,000 parents x 8 children x 4 descents (12.8 M), runs/eof-289-full-s1..4; PROVISIONAL on dive class (b), which the 6-DOF simulator is replacing; the Boeing-calibrated glide band is the reference (Pete, 9 Oct ~18:30). Pooled median impact: held-out 36.78 S, R600/inflated/fuel 37.48 S, R1200/inflated/fuel 36.52 S. ESS clears the pooled 1,000 target for every option (minimum 2,042, both/inflated/fuel). Impact-latitude split-half over all 3 partitions clears the 0.896 floor for 11 of 16 option x cause rows; below it: both/inflated (both causes; fuel 0.849), r1200 no-offset/fuel, r1200 startup-offset/fuel and r600 startup-offset/fuel (minimum partitions 0.890-0.893), so those are quoted as unconverged. See results/eof-289-sweep-oct09/README.md. Two 00:19 bursts (results/eof-two-burst-oct09/README.md): Holland H1:H2 evidence ln BF = -0.34 (sd 0.10 over seeds) with cause other, -1.68 on R600 alone; the two-burst posteriors under H1/H2 stay unconverged (parent-limited, 4-78 effective parents per seed)."

