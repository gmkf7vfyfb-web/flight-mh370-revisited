  <style>
    #mh370-impact-search-overlay { width: 100%; color: var(--foreground); }
    #mh370-impact-search-overlay .mh-legend { margin-bottom: 0.5rem; align-items: center; }
    #mh370-impact-search-overlay .mh-legend > span { display: inline-flex; align-items: center; gap: 0.35rem; }
    #mh370-impact-search-overlay .mh-swatch { display: inline-block; width: 0.9rem; height: 0.65rem; }
    #mh370-impact-search-overlay .mh-line { display: inline-block; width: 1.1rem; height: 0; border-top: 2px solid currentColor; }
    #mh370-impact-search-overlay .mh-density { background: color-mix(in srgb, var(--viz-series-1) 55%, transparent); }
    #mh370-impact-search-overlay .mh-atsb { background: color-mix(in srgb, var(--viz-series-2) 28%, transparent); border: 1px solid var(--viz-series-2); }
    #mh370-impact-search-overlay .mh-oi18 { border: 2px dashed var(--viz-series-3); }
    #mh370-impact-search-overlay .mh-outboard { background: color-mix(in srgb, var(--viz-series-4) 25%, transparent); border: 1px solid var(--viz-series-4); }
    #mh370-impact-search-overlay .mh-inboard { background: color-mix(in srgb, var(--viz-series-5) 25%, transparent); border: 1px solid var(--viz-series-5); }
    #mh370-impact-search-overlay .mh-arc { color: var(--foreground); }
    #mh370-impact-search-overlay .mh-map-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.9rem; }
    #mh370-impact-search-overlay .mh-panel { min-width: 0; }
    #mh370-impact-search-overlay .mh-panel h3 { margin: 0 0 0.25rem; font-weight: 500; }
    #mh370-impact-search-overlay .mh-map svg { display: block; width: 100%; height: auto; }
    #mh370-impact-search-overlay .mh-grid { fill: none; stroke: var(--border); stroke-width: 0.7; }
    #mh370-impact-search-overlay .mh-frame { fill: none; stroke: var(--border); stroke-width: 1; }
    #mh370-impact-search-overlay .mh-tick { fill: var(--muted-foreground); }
    #mh370-impact-search-overlay .mh-axis-label { fill: var(--muted-foreground); }
    #mh370-impact-search-overlay .mh-pdf-cell { fill: var(--viz-series-1); }
    #mh370-impact-search-overlay .mh-hpd90 { fill: none; stroke: var(--viz-series-1); stroke-width: 1.2; }
    #mh370-impact-search-overlay .mh-hpd50 { fill: none; stroke: var(--viz-series-1); stroke-width: 2.2; }
    #mh370-impact-search-overlay .mh-mode { fill: var(--card); stroke: var(--foreground); stroke-width: 1.4; }

    #mh370-impact-search-overlay .mh-inboard-path { fill: var(--viz-series-5); fill-opacity: 0.12; stroke: var(--viz-series-5); stroke-width: 1.2; }
    #mh370-impact-search-overlay .mh-arc-path { fill: none; stroke: var(--foreground); stroke-width: 1.3; }

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
    (() => {
      const root = document.getElementById("mh370-impact-search-overlay");
      const dataNode = document.getElementById("mh370-impact-search-data");
      const data = JSON.parse(dataNode.textContent);
      const extent = data.extent;
      const nx = data.nx;
      const ny = data.ny;
      const width = 580;
      const height = 430;
      const margin = { top: 12, right: 14, bottom: 34, left: 48 };
      const bounds = {
        type: "LineString",
        coordinates: [
          [extent[0], extent[2]],
          [extent[1], extent[2]],
          [extent[1], extent[3]],
          [extent[0], extent[3]],
          [extent[0], extent[2]]
        ]
      };
      const fitBounds = {
        type: "MultiPoint",
        coordinates: [[extent[0], extent[2]], [extent[1], extent[3]]]
      };

      const decode = (encoded) => {
        const binary = atob(encoded);
        const values = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) values[i] = binary.charCodeAt(i);
        return values;
      };

      const signedRingArea = (ring) => d3.pairs(ring).reduce(
        (sum, pair) => sum + pair[0][0] * pair[1][1] - pair[1][0] * pair[0][1],
        0
      ) / 2;

      const rewindPolygon = (polygon) => polygon
        .filter((ring) => ring.length >= 4 && new Set(ring.slice(0, -1).map((point) => point.join(","))).size >= 3)
        .map((ring, index) => {
        const shouldBeClockwise = index === 0;
        const isClockwise = signedRingArea(ring) < 0;
        return shouldBeClockwise === isClockwise ? ring : ring.slice().reverse();
        });

      const rewindGeometry = (geometry) => {
        if (geometry.type === "Polygon") {
          return { ...geometry, coordinates: rewindPolygon(geometry.coordinates) };
        }
        if (geometry.type === "MultiPolygon") {
          return { ...geometry, coordinates: geometry.coordinates.map(rewindPolygon) };
        }
        return geometry;
      };

      const contourToLonLat = (geometry) => {
        const transformPoint = (point) => [
          extent[0] + point[0] / nx * (extent[1] - extent[0]),
          extent[2] + point[1] / ny * (extent[3] - extent[2])
        ];
        return rewindGeometry({
          type: geometry.type,
          value: geometry.value,
          coordinates: geometry.coordinates.map((polygon) =>
            polygon.map((ring) => ring.map(transformPoint))
          )
        });
      };

      const coordinate = (lat, lon) => `${Math.abs(lat).toFixed(1)}°S, ${lon.toFixed(1)}°E`;

      const classes = new Map([
        ["atsb_phase2_2014_2017", "mh-atsb-path"],
        ["oi2018_total_outline_approx", "mh-oi18-path"],
        ["oi2024_proposed_outboard_southeast", "mh-outboard-path"],
        ["oi2024_proposed_inboard_northwest", "mh-inboard-path"],
        ["seventh_arc_fl400", "mh-arc-path"]
      ]);
      const mapFeatures = data.search_features.features.map((feature) => ({
        ...feature,
        geometry: rewindGeometry(feature.geometry)
      }));

      data.pdfs.forEach((pdf, panelIndex) => {
        const host = root.querySelector(`[data-map="${panelIndex}"]`);
        const svg = d3.select(host)
          .append("svg")
          .attr("viewBox", `0 0 ${width} ${height}`)
          .attr("role", "img")
          .attr("aria-label", `${pdf.estimate} impact probability density over historical and proposed seabed search areas`);
        svg.append("title").text(`${pdf.estimate}: impact PDF and search-area overlap`);
        svg.append("desc").text("Relative density shading with 50 and 90 percent highest-posterior-density boundaries, the seventh arc, official ATSB sonar coverage, approximate Ocean Infinity 2018 support, and the two renewed-search proposal bands.");

        const projection = d3.geoMercator().fitExtent(
          [[margin.left, margin.top], [width - margin.right, height - margin.bottom]],
          fitBounds
        );
        const path = d3.geoPath(projection);
        const plot = svg.append("g");

        const graticule = d3.geoGraticule()
          .extent([[extent[0], extent[2]], [extent[1], extent[3]]])
          .step([2, 1]);
        plot.append("path").datum(graticule()).attr("class", "mh-grid").attr("d", path);
        plot.append("path").datum(bounds).attr("class", "mh-frame").attr("d", path);

        const q = decode(pdf.q8_b64);
        const dx = (extent[1] - extent[0]) / nx;
        const dy = (extent[3] - extent[2]) / ny;
        const cells = [];
        for (let row = 0; row < ny; row += 1) {
          for (let col = 0; col < nx; col += 1) {
            const value = q[row * nx + col];
            if (value < 10) continue;
            const south = extent[2] + row * dy;
            const west = extent[0] + col * dx;
            const p0 = projection([west, south]);
            const p1 = projection([west + dx, south + dy]);
            cells.push({
              x: Math.min(p0[0], p1[0]),
              y: Math.min(p0[1], p1[1]),
              width: Math.abs(p1[0] - p0[0]) + 0.35,
              height: Math.abs(p1[1] - p0[1]) + 0.35,
              opacity: 0.06 + 0.58 * Math.pow(value / 255, 1.5)
            });
          }
        }
        plot.append("g")
          .selectAll("rect")
          .data(cells)
          .join("rect")
          .attr("class", "mh-pdf-cell")
          .attr("x", (d) => d.x)
          .attr("y", (d) => d.y)
          .attr("width", (d) => d.width)
          .attr("height", (d) => d.height)
          .attr("opacity", (d) => d.opacity);

        plot.append("g")
          .selectAll("path")
          .data(mapFeatures)
          .join("path")
          .attr("class", (feature) => classes.get(feature.properties.id))
          .attr("d", path);

        const relativeDensity = Array.from(q, (value) => Math.pow(value / 255, 2));
        const thresholds = [
          pdf.hpd_threshold_relative["90"],
          pdf.hpd_threshold_relative["50"]
        ];
        const contours = d3.contours().size([nx, ny]).thresholds(thresholds)(relativeDensity).map(contourToLonLat);
        plot.append("g")
          .selectAll("path")
          .data(contours)
          .join("path")
          .attr("class", (d, i) => i === 0 ? "mh-hpd90" : "mh-hpd50")
          .attr("d", path);

        const modePoint = projection([pdf.mode_lon_deg_E, pdf.mode_lat_deg]);
        plot.append("path")
          .attr("class", "mh-mode")
          .attr("d", d3.symbol().type(d3.symbolStar).size(115)())
          .attr("transform", `translate(${modePoint[0]},${modePoint[1]})`);
        plot.append("text")
          .attr("class", "mh-mode-label text-small")
          .attr("x", modePoint[0] + 9)
          .attr("y", modePoint[1] - 8)
          .text(coordinate(pdf.mode_lat_deg, pdf.mode_lon_deg_E));

        [84, 88, 92, 96].forEach((lon) => {
          const point = projection([lon, extent[2]]);
          plot.append("text")
            .attr("class", "mh-tick text-small")
            .attr("x", point[0])
            .attr("y", height - 16)
            .attr("text-anchor", "middle")
            .text(`${lon}°E`);
        });
        [-40, -38, -36, -34, -32].forEach((lat) => {
          const point = projection([extent[0], lat]);
          plot.append("text")
            .attr("class", "mh-tick text-small")
            .attr("x", margin.left - 8)
            .attr("y", point[1] + 4)
            .attr("text-anchor", "end")
            .text(`${Math.abs(lat)}°S`);
        });
        plot.append("text")
          .attr("class", "mh-axis-label text-small")
          .attr("x", (margin.left + width - margin.right) / 2)
          .attr("y", height - 1)
          .attr("text-anchor", "middle")
          .text("Longitude east");

        const stat = root.querySelector(`[data-stat="${panelIndex}"]`);
        stat.textContent = `Mode ${coordinate(pdf.mode_lat_deg, pdf.mode_lon_deg_E)} · 95% latitude ${Math.abs(pdf.lat_95_high).toFixed(1)}–${Math.abs(pdf.lat_95_low).toFixed(1)}°S`;
      });
    })();
  </script>
