schema_version = 2
name = "MH370 flaperon drift diagnostic — native-grid HYCOM reanalysis sensitivity"
family = "hycom_gofs31_reanalysis"
source_cells = "/jackbox/home/MH370/.sources/ocean-drift-input-preparation/outputs/source-cells.json"
seed = 3700019
particles_per_cell = 1024
release_unix_seconds = 1394237940.0

[sampling]
method = "adaptive_smc"
resampling_interval_days = 30.0
selection_strength = 4.0
start_days_before_recovery = 300.0

[currents]
binary = "/jackbox/home/.cache/mh370-ocean-inputs-native/hycom-native.mhgrid"
metadata = "/jackbox/home/.cache/mh370-ocean-inputs-native/hycom-native.mhgrid.json"
# Do not interpolate over an upstream skipped daily analysis.
maximum_interpolation_gap_hours = 36.0

[stokes]
binary = "/jackbox/home/.cache/mh370-ocean-inputs-multi-debris/converted/cmems-waverys-stokes.mhgrid"
metadata = "/jackbox/home/.cache/mh370-ocean-inputs-multi-debris/converted/cmems-waverys-stokes.mhgrid.json"
maximum_interpolation_gap_hours = 4.0

[wind]
binary = "/jackbox/home/.cache/mh370-ocean-inputs-multi-debris/wind/wind.mhgrid"
metadata = "/jackbox/home/.cache/mh370-ocean-inputs-multi-debris/wind/wind.mhgrid.json"
maximum_interpolation_gap_hours = 36.0

[coast]
binary = "/jackbox/home/.cache/mh370-ocean-inputs-native/hycom-native-coast.mhgrid"
metadata = "/jackbox/home/.cache/mh370-ocean-inputs-native/hycom-native-coast.mhgrid.json"

[motion]
integration_step_seconds = 21600.0
output_step_seconds = 86400.0
# Explicit unresolved-dispersion sensitivity; not fitted to debris recoveries.
horizontal_diffusivity_m2_per_s = 100.0
stokes_velocity_scale = 1.0
windage_fraction = 0.0
# CSIRO Part II empirical flaperon response: 0.10 m/s in excess of Stokes,
# directed 20 degrees left of the wind. This is not the unmeasured 3% law.
windage_speed_m_per_s = 0.10
windage_angle_degrees = -20.0
# This field has no supplied cellwise current standard errors.
current_standard_error_scale = 0.0

[debris]
pre_discovery_window_days = 30.0
spatial_bandwidth_km = 100.0
probability_floor = 1e-9

[[debris.events]]
id = "reunion-flaperon-recovery"
object_ids = ["reunion-right-flaperon"]
location = "Saint-Andre, Reunion"
position = { latitude = -20.916180, longitude = 55.649150 }
discovery_start_unix_seconds = 1438128000.0
# The retained native field ends at 12:00 UTC on the documented discovery
# day. Beaching-to-discovery uncertainty is represented by the delay bins.
discovery_end_unix_seconds = 1438171200.0
evidence_weight = 1.0
is_flaperon = true

[[debris.events.discovery_delay]]
start_days = 0.0
end_days = 30.0
probability = 0.85

[[debris.events.discovery_delay]]
start_days = 30.0
end_days = 90.0
probability = 0.15

[isotope]
records = "/jackbox/home/.cache/mh370-ocean-inputs-multi-debris/auxiliary/a2-g1-isotope.json"
seawater_delta18o_per_mil = 0.4
seawater_delta18o_sd_per_mil = 0.2
calibration_sd_c = 1.0
residual_sd_c = 1.5
sst_field_sd_c = 0.5
shell_smoothing_days = 7.0
correlation_days = 14.0
compatible_simultaneous_confidence = 0.95
rejection_simultaneous_confidence = 0.995
maximum_marginal_log_penalty = 0.6931471805599453
maximum_rejection_log_penalty = 4.605170185988092

[isotope.sst]
